name: Count INO Files

on: [push]

jobs:
  count-ino:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Count .ino files
        run: python scripts/count_ino.py
